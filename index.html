<!DOCTYPE html>
<html>
<head>
    <title>Bounty Bug - Pendaftaran Akun</title>
    <style>
        body {
            background-color: #1a0000;
            color: #f0e0e0;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ff3333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tagline {
            text-align: center;
            color: #cc9999;
            font-size: 13px;
            margin-bottom: 20px;
        }

        hr {
            border: none;
            border-top: 1px solid #cc0000;
            width: 80%;
            margin: 0 auto 20px;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2a0505;
            border: 1px solid #661111;
            border-radius: 6px;
            padding: 30px;
        }

        .form-container h2 {
            color: #ff4444;
            font-size: 16px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #661111;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #ffaaaa;
            font-size: 13px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            background-color: #1a0000;
            border: 1px solid #551111;
            border-radius: 4px;
            color: #f0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff3333;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .field {
            flex: 1;
        }

        .btn-row {
            margin-top: 20px;
            text-align: center;
        }

        input[type="submit"] {
            background-color: #cc2222;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        input[type="submit"]:hover {
            background-color: #ff2222;
        }

        input[type="reset"] {
            background-color: transparent;
            color: #cc9999;
            border: 1px solid #551111;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
            font-family: 'Courier New', monospace;
        }

        input[type="reset"]:hover {
            border-color: #cc9999;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #884444;
            font-size: 12px;
        }

        /* navbar */
        .navbar { overflow: hidden; background-color: #333; margin: -20px -20px 20px -20px; }
        .navbar a { float: left; font-size: 16px; color: white; text-align: center; padding: 14px 16px; text-decoration: none; }
        .dropdown { float: left; overflow: hidden; }
        .dropdown .dropbtn { font-size: 16px; border: none; outline: none; color: white; padding: 14px 16px; background-color: inherit; font-family: inherit; margin: 0; cursor: pointer; }
        .navbar a:hover, .dropdown:hover .dropbtn { background-color: red; }
        .dropdown-content { display: none; position: absolute; background-color: #f9f9f9; min-width: 160px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { float: none; color: black; padding: 12px 16px; text-decoration: none; display: block; text-align: left; }
        .dropdown-content a:hover { background-color: #ddd; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <div class="dropdown">
            <button class="dropbtn">Menu</button>
            <div class="dropdown-content">
                <a href="#">Daftar</a>
                <a href="#">Login</a>
                <a href="#">Tentang</a>
                <a href="#">Kontak</a>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 16px;">
        <img src="banner.jpg" alt="Bug Bounty Hacker" width="300" height="200">
    </div>

    <h1>Bounty Bug Platform</h1>
    <p class="tagline">— Temukan celah keamanan, dapatkan reward! —</p>

    <hr>

    <div class="form-container">
        <h2>Formulir Pendaftaran Akun</h2>

        <div style="text-align: center; margin-bottom: 20px;">
            <img src="shield.jpg" alt="Cyber Security Icon" width="80" height="80">
            <p style="color: #ff9999; font-size: 12px; margin-top: 8px;">
                <i>Bergabunglah dengan kami untuk mewujudkan keamanan siber absolut!</i>
            </p>
        </div>

        <form>

            <div class="field">
                <label>Username</label>
                <input type="text" name="username" list="saran-username" placeholder="Masukkan username" required>
                <datalist id="saran-username">
                    <option value="hacker01">
                    <option value="security_researcher">
                    <option value="bugfinder">
                    <option value="whitehat_dev">
                </datalist>
            </div>

            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="row">
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <div class="field">
                    <label>Konfirmasi Password</label>
                    <input type="password" name="konfirmasi_password" required>
                </div>
            </div>

            <div class="field">
                <label>Role</label>
                <select name="role">
                    <optgroup label="Pencari Bug">
                        <option value="hacker">Hacker</option>
                        <option value="independent_dev">Independent Developer</option>
                        <option value="researcher">Security Researcher</option>
                    </optgroup>
                    <optgroup label="Pemilik Program">
                        <option value="company">Company</option>
                        <option value="startup">Startup</option>
                        <option value="government">Government Agency</option>
                    </optgroup>
                </select>
            </div>

            <div class="row">
                <div class="field">
                    <label>Negara</label>
                    <input type="text" name="negara" list="daftar-negara" placeholder="Ketik negara" required>
                    <datalist id="daftar-negara">
                        <option value="Indonesia">
                        <option value="Malaysia">
                        <option value="Singapore">
                        <option value="United States">
                        <option value="India">
                    </datalist>
                </div>
                <div class="field">
                    <label>Tanggal Lahir</label>
                    <input type="date" name="tgl_lahir">
                </div>
            </div>

            <div class="field">
                <label>Bio Singkat</label>
                <textarea name="bio" rows="4" placeholder="Ceritakan sedikit tentang dirimu..."></textarea>
            </div>

            <div class="btn-row">
                <input type="submit" value="Daftar Sekarang">
                <input type="reset" value="Reset">
            </div>

        </form>
    </div>

    <div class="footer">
        &copy; 2025 Bounty Bug Platform | Keamanan Siber Absolut
    </div>

</body>
</html>
