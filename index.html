<!DOCTYPE html>
<html>
<head>
    <title>Bounty Websie</title>
    <style>
        body { background-color: #1a0001; color: #f0e0e0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff3344; font-size: 24px; margin-bottom: 5px; }
        .tagline { text-align: center; color: #cc9999; font-size: 13px; margin-bottom: 20px; }
        hr { border: none; border-top: 1px solid #cc0000; width: 80%; margin: 0 auto 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background-color: #2a0505; border: 1px solid #661111; border-radius: 6px; padding: 30px; }
        .form-container h2 { color: #ff4444; font-size: 16px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #661111; }
        .field { margin-bottom: 16px; }
        label { display: block; color: #ffaaaa; font-size: 13px; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea { width: 100%; padding: 8px 10px; background-color: #1a0000; border: 1px solid #551111; border-radius: 4px; color: #f0e0e0; font-family: 'Courier New', monospace; font-size: 13px; box-sizing: border-box; }
        .row { display: flex; gap: 12px; }
        .row .field { flex: 1; }
        .btn-row { margin-top: 20px; text-align: center; }
        input[type="submit"] { background-color: #cc2221; color: white; border: none; padding: 10px 24px; font-size: 14px; border-radius: 4px; cursor: pointer; }
        input[type="reset"] { background-color: transparent; color: #cc9999; border: 1px solid #551111; padding: 10px 24px; font-size: 14px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        .footer { text-align: center; margin-top: 20px; color: #884444; font-size: 12px; }
        footer { margin-top: 30px; border-top: 1px solid #661111; padding-top: 15px; }
    </style>
</head>
<body>

    <h1>Bounty Bug Platform</h1>
    <p class="tagline">— Temukan celah keamanan, dapatkan reward! —</p>
    <hr>
    <div class="form-container">
        <h2>Formulir Pendaftaran Akun</h2>
        <form>
            <div class="field"><label>Username</label><input type="text" name="username" required></div>
            <div class="field"><label>Email</label><input type="email" name="email" required></div>
            <div class="btn-row">
                <input type="submit" value="Daftar Sekarang">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
    <div class="footer">&copy; 2026 Bounty Bug Platform</div>

    <footer>
        <p style="text-align: center; color: #ffaaaa; font-size: 14px;">
            Hubungi Kami: <a href="mailto:support@bountybug.com" style="color: #ff3344;">support@bountybug.com</a>
        </p>
    </footer>

</body>
</html>
